[project]
name = "bitcoin-investigation-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "geoip2>=5.3.0",
    "httpx>=0.28.1",
    "neo4j>=6.3.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
bitcoin-investigation-platform = "bitcoin_investigation_platform:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mmdb-writer>=0.2.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
